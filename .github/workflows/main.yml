run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        lambdapi-version: [dev]

    runs-on: ubuntu-latest

    steps:
      - name: Check out library
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Install ocaml and opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git
            lambdapi: https://github.com/deducteam/opam-lambdapi-repository.git

      - name: Install lambdapi.${{ matrix.lambdapi-version }}
        run: opam install lambdapi.${{ matrix.lambdapi-version }}
        if: matrix.lambdapi-version != 'dev'

      - name: Install lambdapi development version
        run: |
          opam pin -n --dev-repo lambdapi
          opam install lambdapi
        if: matrix.lambdapi-version == 'dev'

      - name: Check library
        run: |
          eval $(opam env)
          make
